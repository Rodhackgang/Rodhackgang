# Genere l'animation du serpent qui devore le graphe de contributions.
#
# Le resultat est publie sur la branche `output`, d'ou le README le charge.
# Sans cette branche, l'image du README serait cassee : le workflow doit donc
# avoir tourne au moins une fois avant que le README n'y fasse reference.

name: Serpent des contributions

on:
  schedule:
    - cron: "0 */12 * * *"   # deux fois par jour
  workflow_dispatch:          # declenchement manuel
  push:
    branches:
      - main

jobs:
  generer:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generer les images
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-clair.svg
            dist/snake-sombre.svg?palette=github-dark
            dist/snake.gif?color_snake=orange&color_dots=#0a1f44,#065f5a,#0b5fff,#00c2a8,#7ee7d7

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
